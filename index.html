<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#08080a" />
  <title>Nocturne Writer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2308080a'/%3E%3Cpath d='M20 46V18h8l16 20V18h6v28h-8L26 26v20z' fill='%238b5cf6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./src/css/fonts.css?v=1.2.1">
  <link href="./src/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
  <style>
    /* Critical Preloader styles for instant first paint */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #06060a;
      transition: opacity 800ms cubic-bezier(0.25, 1, 0.5, 1), visibility 800ms ease;
      overflow: hidden;
    }
    #preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .preloader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      text-align: center;
      gap: 16px;
    }
    .preloader-logo-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .preloader-logo-img {
      width: 120px;
      height: 120px;
      background-color: var(--accent, #8b5cf6);
      -webkit-mask-image: url('./src/assets/in_app_icon.png');
      mask-image: url('./src/assets/in_app_icon.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      z-index: 2;
      animation: preloader-orb-pulse 4s ease-in-out infinite alternate;
    }
    .preloader-glow-orb {
      position: absolute;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(var(--accent-rgb, 139, 92, 246), 0.25) 0%, transparent 70%);
      filter: blur(25px);
      animation: preloader-orb-pulse 4s ease-in-out infinite alternate;
      z-index: 1;
      pointer-events: none;
    }
    .preloader-brand {
      position: relative;
      z-index: 2;
      font-family: var(--font-ui-override, 'Lora', Georgia, serif);
      font-size: clamp(2.4rem, 8vw, 3.8rem);
      letter-spacing: 0.35em;
      font-weight: 500;
      color: #ffffff;
      margin: 0;
      padding-left: 0.35em;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      animation: preloader-text-fade 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .preloader-subtitle {
      font-family: var(--font-ui, 'Manrope', sans-serif);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5em;
      color: rgba(255, 255, 255, 0.4);
      padding-left: 0.5em;
      text-transform: uppercase;
      opacity: 0;
      animation: preloader-fade-in 1.2s ease-out 0.6s forwards;
    }
    .preloader-progress-track {
      width: 160px;
      height: 2px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      margin-top: 10px;
      opacity: 0;
      animation: preloader-fade-in 1s ease-out 0.8s forwards;
    }
    .preloader-progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent, #8b5cf6), var(--accent-hover, #a78bfa));
      box-shadow: 0 0 8px var(--accent, #8b5cf6);
      border-radius: 2px;
    }
    .preloader-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .particle {
      position: absolute;
      bottom: -20px;
      border-radius: 50%;
      background: var(--accent, #8b5cf6);
      box-shadow: 0 0 8px var(--accent, #8b5cf6);
      opacity: 0;
      animation: preloader-float-up 4s infinite linear;
    }
    @keyframes preloader-orb-pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.1); opacity: 1; }
    }
    @keyframes preloader-text-fade {
      0% { opacity: 0; transform: translateY(10px); filter: blur(5px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes preloader-fade-in {
      0% { opacity: 0; transform: translateY(5px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes preloader-float-up {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      10% { opacity: 0.4; }
      80% { opacity: 0.4; }
      100% { transform: translateY(-105vh) scale(0.5); opacity: 0; }
    }
  </style>
  <link rel="stylesheet" href="./src/css/variables.css?v=1.2.1" />
  <link rel="stylesheet" href="./src/css/animations.css?v=1.2.1" />
  <link rel="stylesheet" href="./src/css/ui.css?v=1.2.1" />
  <link rel="stylesheet" href="./src/css/polish.css?v=1.2.1" />
  <link rel="stylesheet" href="./src/css/mobile.css?v=1.2.1" />
  <link rel="stylesheet" href="./src/css/bookmarks.css?v=1.2.1" />
  <link rel="stylesheet" href="./src/css/workflows.css?v=1.2.1" />
  <link rel="stylesheet" href="./src/css/languages.css?v=1.2.1" />
  <script>
    try {
      const s = localStorage.getItem('nocturne_settings');
      if (s) {
        const settings = JSON.parse(s);
        if (settings.accent) {
          document.documentElement.style.setProperty('--accent', settings.accent);
          const hex = settings.accent.replace('#', '');
          const r = parseInt(hex.substring(0,2), 16);
          const g = parseInt(hex.substring(2,4), 16);
          const b = parseInt(hex.substring(4,6), 16);
          document.documentElement.style.setProperty('--accent-rgb', `${r}, ${g}, ${b}`);
        }
      }
    } catch(e) {}
  </script>
</head>
<body>
  <div id="preloader">
    <div class="preloader-particles" id="particles-container"></div>
    <div class="preloader-content">
      <div class="preloader-logo-wrapper">
        <div class="preloader-glow-orb"></div>
        <div class="preloader-logo-img"></div>
        <div class="preloader-brand">NOCTURNE</div>
      </div>
      <div class="preloader-subtitle" data-i18n="Вдохновение и сосредоточенность">Inspiration and focus</div>
      <div class="preloader-progress-track">
        <div class="preloader-progress-fill"></div>
      </div>
    </div>
  </div>
  <script>
    // Set initial preloader progress to show startup animation instantly
    setTimeout(() => {
      const fill = document.querySelector('.preloader-progress-fill');
      if (fill) {
        fill.style.transition = 'width 1.5s cubic-bezier(0.22, 1, 0.36, 1)';
        fill.style.width = '35%';
      }
    }, 50);
  </script>
  <div id="electron-titlebar" style="display: none;">
    <div class="titlebar-drag-region"></div>
    <div class="titlebar-left-side">
      <div class="titlebar-brand">
        <div class="titlebar-logo"></div>
        <div class="titlebar-app-name">Nocturne</div>
      </div>
      <div class="titlebar-kb-project-badge" style="display: none;"></div>
    </div>
    <div class="titlebar-title">
      <span class="project-name"></span>
      <span class="title-separator" style="display: none;">/</span>
      <span class="doc-name" style="display: none;"></span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn minimize" id="titlebar-minimize" title="Свернуть" data-i18n-title="Свернуть">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="5.5" width="9" height="1" fill="currentColor"/></svg>
      </button>
      <button class="titlebar-btn maximize" id="titlebar-maximize" title="Развернуть" data-i18n-title="Развернуть">
        <svg width="12" height="12" viewBox="0 0 12 12" id="titlebar-maximize-icon"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="titlebar-btn close" id="titlebar-close" title="Закрыть" data-i18n-title="Закрыть">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5,2.5 L9.5,9.5 M9.5,2.5 L2.5,9.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <div id="app"></div>
  <script src="./src/vendor/jszip/jszip.min.js"></script>
  <script>
    if (typeof module !== 'undefined') {
      window.tempModule = module;
      module = undefined;
    }
  </script>
  <script src="./src/vendor/html2canvas.min.js"></script>
  <script>
    if (window.tempModule) {
      module = window.tempModule;
      window.tempModule = undefined;
    }
  </script>
  <script type="module" src="./src/main.js?v=1.2.1"></script>
</body>
</html>
